name: probe-chunks
# 临时探针：验证 v3 转写（token_lcs 分段）在 60 秒切片上的正文清洁度与时间戳行为。
# 仅 manual 触发，不属于正式流水线；验证完成后由维护者删除。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 缓存语音模型（与主流水线共用同一缓存键）
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-crisper2-small-v1

      - name: 环境准备（ffmpeg + PyTorch CPU + CrisperWhisper）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "crisperwhisper[transformers]"
          pip install -q ctranslate2

      - name: 制作 60 秒测试切片（2 个 30 秒分段）
        run: |
          mkdir -p probe/fixtures probe/out
          ffmpeg -y -loglevel error -i "tests/fixtures/录音01_童年_小时候的家.wav" -t 60 "probe/fixtures/录音01_切片60s.wav"

      - name: 运行 v3 转写
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, '.github/scripts')
          import audio_to_text as a
          from pathlib import Path
          a.FIX = Path('probe/fixtures')
          a.OUT = Path('probe/out')
          a.METRICS = Path('probe/metrics.json')
          a.main()
          PY

      - name: 上传探针产物
        uses: actions/upload-artifact@v4
        with:
          name: probe-out
          path: probe
          retention-days: 2
