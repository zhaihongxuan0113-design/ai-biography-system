# 每周访谈问题自动发送（周一、周四各 1 问，对应《访谈提纲》50 周计划）
# 通知方式：创建仓库 Issue（标签 interview-question）+ 自动指派仓库所有者触发 GitHub 邮件通知，免费且不会进垃圾短信。
# 取题逻辑：已发送数量 = 带 interview-question 标签的 Issue 总数，本次发送第 (数量+1) 问，按顺序自动推进，不重复、不跳号。

name: 每周访谈问题自动发送

on:
  schedule:
    # 北京时间每周一、周四 09:00（UTC 01:00）
    - cron: '0 1 * * 1,4'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: weekly-question
  cancel-in-progress: false

jobs:
  send-question:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      PAGES_URL: https://zhaihongxuan0113-design.github.io/ai-biography-system/
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 确保标签 interview-question 存在
        run: |
          gh label create interview-question \
            --repo "$REPO" \
            --description "每周自动发送的访谈问题" \
            --color 0e8a16 || true

      - name: 计算下一个问题序号（已发送数 = 该标签下 Issue 总数）
        id: next
        run: |
          count=$(gh issue list --repo "$REPO" --label interview-question --state all --limit 200 --json number | jq 'length')
          next=$((count + 1))
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "本次发送：第 $next 问"

      - name: 生成问题内容并创建 Issue（指派仓库所有者 → 触发邮件通知）
        env:
          NEXT: ${{ steps.next.outputs.next }}
        run: |
          if [ "$NEXT" -gt 100 ] 2>/dev/null; then
            echo "全部 100 问已发送完毕，本次跳过。"
            exit 0
          fi
          QUESTION=$(jq -r --argjson n "$NEXT" '.[$n - 1].q' tests/questions.json)
          CATEGORY=$(jq -r --argjson n "$NEXT" '.[$n - 1].cat' tests/questions.json)
          HINT=$(jq -r --argjson n "$NEXT" '.[$n - 1].hint' tests/questions.json | sed 's/^追问：//')
          WEEK=$(( (NEXT + 1) / 2 ))
          TITLE="【访谈 · 第${WEEK}周】第${NEXT}问｜${CATEGORY}"
          printf '%s\n' \
            "**第 ${WEEK} 周 · 第 ${NEXT} 问（共 100 问）｜类别：${CATEGORY}**" \
            "" \
            "## 本周问题" \
            "" \
            "${QUESTION}" \
            "" \
            "## 追问提示" \
            "" \
            "${HINT}" \
            "" \
            "## 回答方式（任选其一）" \
            "" \
            "1. **录音回答（推荐）**：用手机录 3-5 分钟，按说明页的格式起名字，再选一种方式发给我们。说明页：${PAGES_URL}" \
            "2. **文字回答**：直接在本 Issue 下方评论，怎么想就怎么写，不用讲究。" \
            "" \
            "## 小提醒" \
            "" \
            "- 本 Issue 由 GitHub Actions 定时任务自动创建（每周一、周四各 1 问）；" \
            "- 回答完成后，请点击右下角 Close issue 关闭本话题；" \
            "- 全部 100 问见 docs/访谈提纲.md。" \
            "" \
            "---" \
            "" \
            "> 通知说明：本 Issue 已自动指派给仓库所有者，GitHub 会同步发送邮件通知；Watch 本仓库后，新 Issue 也会邮件提醒。" \
            > body.md
          gh issue create \
            --repo "$REPO" \
            --title "$TITLE" \
            --body-file body.md \
            --label interview-question \
            --assignee "$OWNER"
          echo "Issue 已创建：$TITLE"
